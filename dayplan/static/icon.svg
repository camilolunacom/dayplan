<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="dayplan">
  <rect width="128" height="128" rx="26" fill="#1b1e24"/>
  <!-- three source stripes: ticktick, asana, jira -->
  <rect x="20" y="28" width="5" height="20" rx="2.5" fill="#4bb6a8"/>
  <rect x="20" y="56" width="5" height="20" rx="2.5" fill="#e2739a"/>
  <rect x="20" y="84" width="5" height="20" rx="2.5" fill="#6aa6ff"/>
  <!-- the ordered plan -->
  <rect x="35" y="30" width="58" height="16" rx="5" fill="#2d333c"/>
  <rect x="35" y="58" width="72" height="16" rx="5" fill="#2d333c"/>
  <rect x="35" y="86" width="45" height="16" rx="5" fill="#2d333c"/>
  <!-- drag handle dots on the top card -->
  <g fill="#6aa6ff">
    <circle cx="84" cy="35" r="2"/><circle cx="84" cy="41" r="2"/>
    <circle cx="90" cy="35" r="2"/><circle cx="90" cy="41" r="2"/>
