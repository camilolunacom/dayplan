<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>dayplan</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">dayplan</div>
  <div class="spacer"></div>
  <div class="stats" id="stats"></div>
  <div class="integrations" id="integrations"></div>
  <button id="sync" class="primary">Sync</button>
</header>

<main>
  <div class="listbar">
    <h2>The list <span class="count" id="list-count">0</span></h2>
    <input type="search" id="search" placeholder="filter…" autocomplete="off">
    <div class="chips" id="source-chips"></div>
  </div>

  <div class="list" id="task-list"></div>
  <div class="hint">Drag to set the order. Whatever ends up first becomes the task you are working on.</div>
</main>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <h3>Integrations</h3>
    <button class="iconbtn" id="drawer-close" title="Close">✕</button>
  </div>
  <div id="drawer-body"></div>
</div>

<div id="toast" class="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
