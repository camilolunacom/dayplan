<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>dayplan</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">dayplan</div>
  <div class="spacer"></div>
  <div class="stats" id="stats"></div>
  <div class="integrations" id="integrations"></div>
  <button id="sync" class="primary">Sync</button>
</header>

<main>
  <section class="panel panel-main">
    <div class="panel-head">
      <h2>The list <span class="count" id="list-count">0</span></h2>
      <input type="search" id="search" placeholder="filter…" autocomplete="off">
      <div class="chips" id="source-chips"></div>
    </div>
    <div class="list" id="task-list"></div>
    <div class="hint">Drag to set the order. Whatever ends up first is what you are working on.</div>
  </section>

  <section class="panel panel-new">
    <div class="panel-head">
      <h2>New <span class="count" id="new-count">0</span></h2>
    </div>
    <div class="list" id="new-list"></div>
    <div class="hint">Arrivals land here, so a sync never disturbs the order you set. Drag one across to keep it.</div>
  </section>

  <section class="panel panel-later">
    <div class="panel-head">
      <h2>Later <span class="count" id="later-count">0</span></h2>
    </div>
    <div class="list" id="later-list"></div>
    <div class="hint">Seen tasks you have not ordered yet.</div>
  </section>
</main>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <h3>Integrations</h3>
    <button class="iconbtn" id="drawer-close" title="Close">✕</button>
  </div>
  <div id="drawer-body"></div>
</div>

<div id="toast" class="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
