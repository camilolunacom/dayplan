[project]
name = "dayplan"
version = "0.1.0"
description = "Pull tasks from TickTick, Asana and Jira into one place, order them by hand, and plan the day."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
]

[project.scripts]
dayplan = "dayplan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dayplan"]
